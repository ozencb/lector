services:
  lector:
    image: ghcr.io/ozencb/lector:latest
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/server/data
    environment:
      - NODE_ENV=production
      - TTS_SERVICE_URL=http://tts:5000
      - TTS_CONCURRENCY=2
    mem_limit: 512m
    depends_on:
      tts:
        condition: service_healthy
    restart: unless-stopped

  tts:
    image: ghcr.io/ozencb/lector-tts:latest
    build: ./tts
    volumes:
      - ./data:/app/data
    environment:
      - IDLE_TIMEOUT_SECONDS=600
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
